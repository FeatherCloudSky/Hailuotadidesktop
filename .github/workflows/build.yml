name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build, check, and package
        shell: powershell
        run: ./src/release.ps1
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: hailuotadi-windows-x64
          path: |
            dist/Hailuotadi-Setup-x64.exe
            dist/Hailuotadi-Portable-x64.zip
            dist/SHA256SUMS.txt
      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-check-reports
          path: |
            build/app/checks/*.txt
            build/app/checks/bubble-*.png
          if-no-files-found: ignore
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hailuotadi-windows-x64
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "海洛塔帝桌宠 $GITHUB_REF_NAME" --notes-file CHANGELOG.md
          fi
          gh release upload "$GITHUB_REF_NAME" dist/Hailuotadi-Setup-x64.exe dist/Hailuotadi-Portable-x64.zip dist/SHA256SUMS.txt --clobber
